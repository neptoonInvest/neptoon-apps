name: Neptoon SEO Knowledge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-knowledge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run SEO publication engine
        run: node scripts/generate_knowledge.mjs
